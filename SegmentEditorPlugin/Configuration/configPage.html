    <div id="SegmentEditor" data-role="page" class="page type-interior pluginConfigurationPage">
        <style>
            body.segment-editor-hide-jf-header header.MuiAppBar-root {
                display: none !important;
            }

            body.segment-editor-hide-jf-header #SegmentEditor.page.type-interior {
                padding-top: 0 !important;
            }
        </style>
        <script>
            (() => {
                const root = document.getElementById('SegmentEditor');
                if (!root) {
                    return;
                }

                const className = 'segment-editor-hide-jf-header';
                const cleanupKey = Symbol.for('segment-editor.config-page.cleanup');
                const previousCleanup = window[cleanupKey];
                if (typeof previousCleanup === 'function') {
                    previousCleanup();
                }

                const isVisible = () => {
                    if (!document.body.contains(root)) {
                        return false;
                    }

                    if (root.hasAttribute('hidden') || root.getAttribute('aria-hidden') === 'true') {
                        return false;
                    }

                    const style = window.getComputedStyle(root);
                    if (style.display === 'none' || style.visibility === 'hidden' || style.opacity === '0') {
                        return false;
                    }

                    return root.getClientRects().length > 0;
                };

                const syncHeader = () => {
                    document.body.classList.toggle(className, isVisible());
                };

                const clearHeader = () => document.body.classList.remove(className);

                const stopPlayback = () => {
                    const mediaElements = document.querySelectorAll('video, audio');
                    for (const media of mediaElements) {
                        try {
                            media.pause();
                        } catch {}

                        try {
                            media.removeAttribute('src');
                            const sources = media.querySelectorAll('source');
                            for (const source of sources) {
                                source.removeAttribute('src');
                            }

                            media.load();
                        } catch {}
                    }

                    const dashboard = window.Dashboard;
                    if (dashboard && typeof dashboard.stopPlayback === 'function') {
                        try {
                            dashboard.stopPlayback();
                        } catch {}
                    }
                };

                const handleNavigationChange = () => {
                    stopPlayback();
                    syncHeader();
                };

                const handlePageExit = () => {
                    stopPlayback();
                    clearHeader();
                };

                const rootObserver = new MutationObserver(syncHeader);
                rootObserver.observe(root, {
                    attributes: true,
                    attributeFilter: ['class', 'style', 'hidden', 'aria-hidden'],
                });

                const containmentObserver = new MutationObserver(syncHeader);
                for (let ancestor = root.parentElement; ancestor; ancestor = ancestor.parentElement) {
                    containmentObserver.observe(ancestor, { childList: true });
                    if (ancestor === document.body) {
                        break;
                    }
                }

                const cleanup = () => {
                    rootObserver.disconnect();
                    containmentObserver.disconnect();
                    window.removeEventListener('pagehide', handlePageExit);
                    window.removeEventListener('beforeunload', handlePageExit);
                    window.removeEventListener('pageshow', syncHeader);
                    window.removeEventListener('hashchange', handleNavigationChange);
                    window.removeEventListener('popstate', handleNavigationChange);
                    document.removeEventListener('visibilitychange', syncHeader);
                    clearHeader();

                    if (window[cleanupKey] === cleanup) {
                        delete window[cleanupKey];
                    }
                };

                window[cleanupKey] = cleanup;
                window.addEventListener('pagehide', handlePageExit);
                window.addEventListener('beforeunload', handlePageExit);
                window.addEventListener('pageshow', syncHeader);
                window.addEventListener('hashchange', handleNavigationChange);
                window.addEventListener('popstate', handleNavigationChange);
                document.addEventListener('visibilitychange', syncHeader);
                syncHeader();
            })();
        </script>
